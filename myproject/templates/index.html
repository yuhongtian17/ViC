<!DOCTYPE html>
<html>

<head>
    <title>Anti-neutron Reconstruction from ROOT file</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* 新增下载按钮样式 */
        .download-btn {
            background: #28a745;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            margin-left: 15px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        /* 错误提示样式增强 */
        #error-message {
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        /* 进度条容器 */
        .progress-container {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            display: none;
            /* 默认隐藏 */
        }

        /* 进度条 */
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            transition: width 0.3s ease;
            position: absolute;
        }

        /* 进度文字 */
        .progress-text {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            z-index: 2;
        }

        /* 日志窗口样式 */
        #log-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 500px !important;
            box-sizing: border-box;
            min-height: 500px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 15px;
            border-radius: 5px 5px 0 0;
            overflow-y: scroll !important;
            /* 替换原来的auto */
            overflow-x: hidden !important;
            font-family: 'Courier New', monospace;
            box-shadow: 0 -2px 15px rgba(0, 255, 0, 0.2);
            z-index: 9999;
            border-top: 2px solid #00ff00;

            /* 层级保护 */
            transform: translate3d(0, 0, 0);
            isolation: isolate;
        }

        #log-container {
            scrollbar-color: white transparent !important;
            scrollbar-width: thin !important;
        }

        /* Chrome/Edge/Safari 滚动条定制 */
        #log-container::-webkit-scrollbar {
            width: 12px !important;
            background-color: rgba(0, 0, 0, 0.3) !important;
        }

        #log-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1) !important;
            ;
            /* 轨道微白 */
            border-radius: 5px !important;
            ;
        }

        #log-container::-webkit-scrollbar-thumb {
            background: white !important;
            ;
            /* 滑块白色 */
            border-radius: 5px !important;
            ;
            border: 3px solid rgba(0, 0, 0, 0.2) !important;
            ;
            /* 添加黑色描边 */
        }

        #log-container::-webkit-scrollbar-thumb:hover {
            background: #e0e0e0 !important;
            ;
            /* 悬停时变浅灰 */
        }


        #log-content {
            height: calc(100% - 40px);
            overflow-y: auto !important;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            overflow-x: hidden;
            width: calc(100% - 12px);
            /* 适配加宽的滚动条 */
            padding-right: 4px;
            /* 增加右侧间距 */
        }

        /* 高度切换按钮 */
        .log-toggle {
            position: absolute;
            top: 1px;
            right: 15px;
            background: #00ff00;
            color: #000;
            border: none;
            padding: 2px 10px;
            cursor: pointer;
            border-radius: 3px 3px 0 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Anti-neutron Reconstruction from ROOT file</h1>

        <!-- 上传表单（限制为.root文件） -->
        <div class="upload-section">
            <input type="file" id="fileInput" accept=".root" onchange="validateFile()">
            <button type="button" id="uploadBtn" onclick="uploadFile()">Upload ROOT file</button>
            <button class="download-btn" id="downloadBtn" onclick="downloadXLSX()" disabled>Download Excel file</button>
        </div>

        <!-- 增强的错误提示 -->
        <div id="error-message" style="display: none;"></div>

        <!-- 添加上传进度条 -->
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
            <div id="progress-text" class="progress-text">0%</div>
        </div>


        <!-- 显示错误信息 -->
        {% if error %}
        <div id="errorMessage" style="color: red; margin-top: 20px;">
            {{ error }}
        </div>
        {% endif %}
    </div>
    <!-- 新增日志窗口 -->
    <div id="log-container">
        <h3 style="color: #00ff00; margin:0 0 10px 0;">Background Logs</h3>
        <div id="log-content"></div>
    </div>

    <script>

        // 文件类型验证
        function validateFile() {
            const fileInput = document.getElementById('fileInput');
            const errorDiv = document.getElementById('error-message');
            if (fileInput.files[0] && !fileInput.files[0].name.endsWith('.root')) {
                showError('Support ROOT file only!');
                fileInput.value = '';
                return false;
            }
            return true;
        }

        // 改进后的上传函数
        function uploadFile() {
            if (!validateFile()) return;

            // 获取按钮引用
            const uploadBtn = document.getElementById('uploadBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            // 锁定交互
            uploadBtn.disabled = true;
            downloadBtn.disabled = true;

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            // 获取进度条元素
            const progressContainer = document.querySelector('.progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            // 创建XHR对象
            const xhr = new XMLHttpRequest();

            // 显示进度条
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = '0%';

            // 配置请求
            xhr.open('POST', '/', true); // 注意修改了接口地址

            // 上传进度事件
            xhr.upload.addEventListener('progress', function (e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressText.textContent = percent + '%';

                    // 到达100%时保持短暂显示
                    if (percent === 100) {
                        progressText.textContent = 'Upload ROOT file successfully!';
                    }
                }
            });

            // 请求完成处理
            xhr.onload = function () {
                // 无论成功与否都解除上传锁定
                uploadBtn.disabled = false;
                document.getElementById('fileInput').disabled = false;
                downloadBtn.disabled = false;  // 启用下载按钮
                document.getElementById('downloadBtn').disabled = false;
                progressContainer.style.display = 'none';

                try {
                    const response = JSON.parse(xhr.responseText);

                    // HTTP状态码判断
                    if (xhr.status === 200) {
                        // 业务逻辑成功判断
                        if (response.success) {
                            // 成功分支
                            showError('', true);  // 清除错误提示
                            addLog(`Upload ROOT file successfully: ${file.name}`);
                            fileInput.value = '';  // 清空文件选择
                            updateLogs();  // 刷新日志
                            
                        } else {
                            // 业务逻辑失败
                            showError(response.error || 'ROOT file processing failed!');
                        }
                    } else {
                        // HTTP错误状态处理
                        showError(response.error || `Server ERROR: ${xhr.status}`);
                    }
                } catch (e) {
                    // JSON解析失败处理
                    showError('JSON file parsing failed: ' + e.message);
                }
            };

            // 错误处理
            xhr.onerror = function () {
                uploadBtn.disabled = false;
                document.getElementById('fileInput').disabled = false;
                downloadBtn.disabled = false;  // 启用下载按钮
                document.getElementById('downloadBtn').disabled = false;
                showError('Network connection ERROR!');
            };

            // 发送请求
            xhr.send(formData);
        }

        // 新增XLSX下载功能
        async function downloadXLSX() {
            try {
                // 直接获取最新文件（不需要禁用按钮）
                const xlsxList = await fetch('/list_xlsx')
                    .then(res => {
                        if (!res.ok) throw new Error('List retrieval failed!');
                        return res.json();
                    });

                if (xlsxList.length === 0) {
                    throw new Error('Excel not found!');
                }

                // 取最新文件下载
                const latestFile = xlsxList[0];
                window.location.href = `/download/${encodeURIComponent(latestFile)}`;
            } catch (error) {
                showError(`Excel download failed: ${error.message}`);
            }
        }

        // 修改日志更新函数
        function updateLogs() {
            fetch('/get_logs')  // 修改接口地址
                .then(response => {
                    if (!response.ok) throw new Error('Logs retrieval failed!');
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        console.error(data.error);
                        return;
                    }

                    const logContent = document.getElementById('log-content');
                    // 保存当前滚动位置
                    const wasScrolledBottom = logContent.scrollHeight - logContent.clientHeight <= logContent.scrollTop + 1;
                    // 更新内容
                    logContent.textContent = data.logs;
                    // 在下一个事件循环中执行滚动
                    setTimeout(() => {
                        // 只有之前已经在底部才自动滚动
                        if (wasScrolledBottom) {
                            logContent.scrollTop = logContent.scrollHeight;
                        }
                    }, 0);
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Real-time logs retrieval failed!');
                });
        }

        // 调整轮询间隔为1秒（根据日志量调整）
        setInterval(updateLogs, 1000);
        updateLogs();
    </script>
</body>
<grammarly-desktop-integration data-grammarly-shadow-root="true">
    <style>
        div.grammarly-desktop-integration {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        div.grammarly-desktop-integration:before {
            content: attr(data-content);
        }
    </style>
    <div aria-label="grammarly-integration" role="group" tabindex="-1" class="grammarly-desktop-integration"
        data-content="{&quot;mode&quot;:&quot;full&quot;,&quot;isActive&quot;:true,&quot;isUserDisabled&quot;:false}">
    </div>
</grammarly-desktop-integration>

</html>
